<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7f2" />
    <meta name="description" content="Trishia's colorful wishlist." />
    <title>Trishia's Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="opening" id="opening" aria-label="Opening">
        <div class="opening-orbit orbit-one"></div><div class="opening-orbit orbit-two"></div>
        <span class="flower flower-a" aria-hidden="true">✿</span><span class="flower flower-b" aria-hidden="true">✽</span>
        <span class="flower flower-c" aria-hidden="true">✿</span><span class="flower flower-d" aria-hidden="true">✾</span>
        <div class="intro-card">
          <div class="gift" aria-hidden="true"><span>✿</span><i></i></div>
          <button class="begin-button" id="begin" type="button">Tap to begin&nbsp; <span aria-hidden="true">♫</span></button>
        </div>
      </section>

      <section class="welcome is-hidden" id="welcome" aria-label="Welcome">
        <div class="welcome-wash"></div>
        <span class="petal petal-1" aria-hidden="true">✿</span><span class="petal petal-2" aria-hidden="true">✽</span>
        <span class="petal petal-3" aria-hidden="true">✾</span><span class="petal petal-4" aria-hidden="true">✿</span>
        <span class="sparkle sparkle-1" aria-hidden="true">✧</span><span class="sparkle sparkle-2" aria-hidden="true">✦</span>
        <h1>Trishia's 3 Wishlists</h1>
        <button class="view-button" id="view" type="button">View My Wishlists <span aria-hidden="true">→</span></button>
      </section>

      <section class="gallery is-hidden" id="gallery" aria-label="Wishlist">
        <div class="gallery-decor decor-left" aria-hidden="true">✿</div><div class="gallery-decor decor-right" aria-hidden="true">✽</div>
        <div class="cards">
          <article class="wish-card card-pink">
            <div class="image-frame"><img src="Public/Bash_Office_Purse.jpeg" alt="Bash Office Purse" /></div>
            <h2>Bash Office Purse</h2>
            <a class="shop-link" href="https://ph.shp.ee/fHQgdYrs" target="_blank" rel="noopener noreferrer">View item <span aria-hidden="true">↗</span></a>
          </article>
          <article class="wish-card card-mint">
            <div class="image-frame"><img src="Public/Large_Foldable_Laundry_Basket.jpeg" alt="Large Foldable Laundry Basket" /></div>
            <h2>Large Foldable Laundry Basket</h2>
            <a class="shop-link" href="https://ph.shp.ee/gFSp7LoM" target="_blank" rel="noopener noreferrer">View item <span aria-hidden="true">↗</span></a>
          </article>
          <article class="wish-card card-lilac">
            <div class="image-frame"><img src="Public/Expandable_Travel_Organizer.jpeg" alt="Expandable Travel Organizer" /></div>
            <h2>Expandable Travel Organizer</h2>
            <a class="shop-link" href="https://ph.shp.ee/5GNji8gW" target="_blank" rel="noopener noreferrer">View item <span aria-hidden="true">↗</span></a>
          </article>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
